name: Build unsigned iOS

# Builds an unsigned .ipa for sideloading with AltStore Classic (which re-signs it
# with your free Apple ID). No code signing, EAS or Apple credentials involved.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: sous                      # expo.name in app.json -> sous.app / sous.ipa
  SCHEME: sous                        # scheme generated by `expo prebuild -p ios`
  WORKSPACE: ios/sous.xcworkspace     # created by `pod install`
  ARTIFACT_NAME: sous-ios-unsigned    # release.yml downloads this by name

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22            # Expo SDK 54 needs Node >= 20.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Managed Expo project: ios/ isn't committed, so generate it. --no-install
      # because pods are installed below, after the Pods cache is restored.
      - name: Generate iOS project
        run: |
          if [ -d ios ]; then
            echo "ios/ is committed; skipping prebuild"
          else
            npx expo prebuild -p ios --no-install
          fi

      # Pods only change when JS dependencies or app.json plugins change.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Xcode version
        run: xcodebuild -version

      # CODE_SIGNING_ALLOWED=NO builds without a certificate or provisioning
      # profile; AltStore signs the app on the phone.
      - name: Archive (unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi

      - name: Package .ipa
        run: |
          APPS_DIR="$RUNNER_TEMP/$APP_NAME.xcarchive/Products/Applications"
          APP=$(find "$APPS_DIR" -maxdepth 1 -name '*.app' -print -quit 2>/dev/null)
          if [ -z "$APP" ]; then
            echo "::error::No .app found in $APPS_DIR. Check the Archive step: the scheme may have built a different product, or the archive failed silently."
            find "$RUNNER_TEMP/$APP_NAME.xcarchive" -maxdepth 4 || true
            exit 1
          fi

          # prebuild hard-codes CFBundleVersion "1"; use the run number so each
          # build has a distinct build version (AltStore's source uses it).
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$APP/Info.plist"

          # An .ipa is a zip containing Payload/<App>.app; -y keeps framework symlinks.
          mkdir -p "$RUNNER_TEMP/pkg/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/pkg/Payload/"
          (cd "$RUNNER_TEMP/pkg" && zip -qry "$GITHUB_WORKSPACE/dist/$APP_NAME.ipa" Payload)

          # Metadata for release.yml's AltStore source. AltStore refuses to install
          # an app whose entitlements/privacy keys differ from what the source
          # lists, so read them from the built app rather than hard-coding them.
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null || true
          python3 - "$APP/Info.plist" "$RUNNER_TEMP/entitlements.plist" > dist/build-info.json <<'PY'
          import json, plistlib, sys
          info = plistlib.load(open(sys.argv[1], "rb"))
          try:
              entitlements = sorted(plistlib.load(open(sys.argv[2], "rb")).keys())
          except Exception:
              entitlements = []  # unsigned build: nothing embedded
          print(json.dumps({
              "name": info.get("CFBundleDisplayName") or info.get("CFBundleName"),
              "bundleIdentifier": info["CFBundleIdentifier"],
              "version": info["CFBundleShortVersionString"],
              "buildVersion": info["CFBundleVersion"],
              "minOSVersion": info.get("MinimumOSVersion"),
              "entitlements": entitlements,
              "privacy": {k: v for k, v in info.items() if k.endswith("UsageDescription")},
          }, indent=2))
          PY
          cat dist/build-info.json
          ls -l dist

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/${{ env.APP_NAME }}.ipa
            dist/build-info.json
          if-no-files-found: error
          compression-level: 0        # the .ipa is already a zip
          retention-days: 30
